# Main CI/CD pipeline: Validate -> Dev -> Test -> Prod
#
# Runs on every push to main that touches infrastructure, pipelines or scripts.
# Pull requests are handled by pr-validation.yml (no deployment).
# All stage/job logic lives in ./templates - this file only sets the triggers.

name: infra-$(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - infra/*
      - pipelines/*
      - scripts/*

pr: none

extends:
  template: templates/pipeline.yml
  parameters:
    deploy: true