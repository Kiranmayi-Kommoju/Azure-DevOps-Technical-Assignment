# Deploys main.bicep at subscription scope (Incremental - safe to re-run)
# and publishes the resource group name for the validation step.
#
# The API key is a secret variable from the environment's variable group.
# Secret variables are NOT exposed to scripts automatically - it is mapped
# explicitly into EXTERNAL_API_KEY for this one step only, and is read by
# the .bicepparam file via readEnvironmentVariable(). It is never echoed,
# never passed on the command line, and Azure DevOps masks it in logs.

parameters:
  - name: serviceConnection
    type: string
  - name: environmentName
    type: string
  - name: location
    type: string

steps:
  - task: AzureCLI@2
    displayName: Deploy infrastructure (${{ parameters.environmentName }})
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail

        if [ -z "${EXTERNAL_API_KEY:-}" ]; then
          echo "##vso[task.logissue type=error]Secret variable 'externalApiKey' is not set in the variable group."
          exit 1
        fi

        az deployment sub create \
          --name "$(deploymentName)" \
          --location "${{ parameters.location }}" \
          --template-file infra/main.bicep \
          --parameters "infra/parameters/${{ parameters.environmentName }}.bicepparam" \
          --only-show-errors \
          --output none

        rg=$(az deployment sub show --name "$(deploymentName)" --query properties.outputs.resourceGroupName.value -o tsv)
        sub=$(az account show --query id -o tsv)
        echo "Deployed to resource group: $rg"
        echo "##vso[task.setvariable variable=resourceGroupName]$rg"
        echo "##vso[task.setvariable variable=subscriptionId]$sub"
    env:
      EXTERNAL_API_KEY: $(externalApiKey)